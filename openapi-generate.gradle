// OpenAPI DTO Generator - configuration applied from `build.gradle`

group = 'com.gymapi'
version = '0.0.1-SNAPSHOT'

repositories {
    mavenCentral()
}

// Configure OpenAPI Generate task
openApiGenerate {
    generatorName = "spring"
    inputSpec = "$projectDir/src/main/resources/openapi/auth-api.yaml"
    outputDir = "$projectDir/src/generated"
    modelPackage = "com.gymapi.auth.adapter.in.web.dto.generated"
    apiPackage = "com.gymapi.auth.adapter.in.web.api.generated"
    invokerPackage = "com.gymapi.auth.adapter.in.web.invoker.generated"
    
    configOptions = [
        interfaceOnly: "false",
        useOptional: "false",
        implicitHeaders: "true",
        swaggerAnnotations: "false",
        beanAnnotations: "false",
        useJakarta: "true",
        disableValidationJsonAnnotations: "true",
        serializableModel: "false",
        additionalModelTypeAnnotations: "@lombok.Data @lombok.Builder @lombok.NoArgsConstructor @lombok.AllArgsConstructor"
    ]
    
    globalProperties = [
        modelTests: "false",
        apiTests: "false",
        generateApis: "false"
    ]
}

// Task to clean up unwanted generated files (keep only DTOs)
task cleanupGeneratedFiles {
    description = "Remove unwanted generated files, keep only DTOs"
    group = "openapi"
    
    doLast {
        def baseDir = file("$projectDir/src/generated/src/main/java")
        
        // List of packages to remove
        def dirsToRemove = [
            "com/gymapi/auth/adapter/in/web/api",
            "com/gymapi/auth/adapter/in/web/invoker",
            "com/gymapi/auth/adapter/out",
            "com/gymapi/auth/application",
            "org/openapitools"
        ]
        
        dirsToRemove.each { dirPath ->
            def dir = new File(baseDir, dirPath)
            if (dir.exists()) {
                dir.deleteDir()
                println "Removed: ${dirPath}"
            }
        }
        
        // Remove individual non-generated files in dto folder
        def dtoDir = new File(baseDir, "com/gymapi/auth/adapter/in/web/dto")
        if (dtoDir.exists()) {
            dtoDir.listFiles()?.each { file ->
                if (file.isFile() && !file.name.contains('generated') && !file.name.endsWith('.java')) {
                    file.delete()
                }
                if (file.isFile() && file.name.endsWith('.java') && !file.name.contains("generated")) {
                    file.delete()
                }
            }
            def authDir = new File(dtoDir, "auth")
            if (authDir.exists() && authDir.isDirectory()) {
                authDir.deleteDir()
            }
        }
        
        println "✓ Cleanup complete"
    }
}

// Task to remove duplicate constructors from generated DTOs
task fixDuplicateConstructors {
    description = "Remove duplicate constructors from generated DTOs"
    group = "openapi"
    
    doLast {
        def dtoDir = file("$projectDir/src/generated/src/main/java/com/gymapi/auth/adapter/in/web/dto/generated")
        
        if (!dtoDir.exists()) {
            return
        }
        
        dtoDir.eachFileRecurse(groovy.io.FileType.FILES) { file ->
            if (file.name.endsWith('.java')) {
                def content = file.text
                
                if (!content.contains('@lombok.Data')) {
                    return
                }
                
                // Remove no-args constructor
                content = content.replaceAll(~/  public \w+\(\) \{[^}]*\}\n\n/, '\n')
                
                // Remove all-args constructor
                content = content.replaceAll(~/  public \w+\([^)]+\) \{[^}]*\}\n\n/, '\n')
                
                // Clean up multiple blank lines
                content = content.replaceAll(/\n{3,}/, '\n\n')
                
                file.text = content
                println "Fixed constructors in: ${file.name}"
            }
        }
        
        println "✓ Constructor cleanup complete"
    }
}

// Task to remove @Builder from classes with List fields that have initializers
task fixBuilderForListFields {
    description = "Remove @Builder from classes with List initializers"
    group = "openapi"
    
    doLast {
        def dtoDir = file("$projectDir/src/generated/src/main/java/com/gymapi/auth/adapter/in/web/dto/generated")
        
        if (!dtoDir.exists()) {
            return
        }
        
        dtoDir.eachFileRecurse(groovy.io.FileType.FILES) { file ->
            if (file.name.endsWith('.java')) {
                def content = file.text
                
                if (!content.contains('@lombok.Data')) {
                    return
                }
                
                // Check if class has List fields with initializers
                def hasListWithInitializer = content =~ /private List<\w+> \w+ = new/
                
                if (hasListWithInitializer) {
                    // Remove @Builder annotation
                    content = content.replace('@lombok.Builder', '')
                    content = content.replace('@lombok.Builder', '')
                    content = content.replace('@Builder', '')
                    
                    // Clean up blank lines from removed annotation
                    content = content.replaceAll(/\n{3,}/, '\n\n')
                    
                    file.text = content
                    println "Removed @Builder from: ${file.name} (has List with initializer)"
                }
            }
        }
        
        println "✓ Builder fix complete"
    }
}

// Run cleanup after generation
tasks.named('openApiGenerate') {
    finalizedBy cleanupGeneratedFiles
    finalizedBy fixDuplicateConstructors
    finalizedBy fixBuilderForListFields
}
