// OpenAPI DTO Generator - Run with: ./gradlew -b openapi-generate.gradle generateOpenApiDto

plugins {
    id 'org.openapi.generator' version '7.3.0' apply false
}

apply plugin: 'org.openapi.generator'

group = 'com.gymapi'
version = '0.0.1-SNAPSHOT'

repositories {
    mavenCentral()
}

// Configure OpenAPI Generate task
openApiGenerate {
    generatorName = "spring"
    inputSpec = "$projectDir/src/main/resources/openapi/auth-api.yaml"
    outputDir = "$projectDir/src/generated"
    modelPackage = "com.gymapi.auth.adapter.in.web.dto.generated"
    apiPackage = "com.gymapi.auth.adapter.in.web.api.generated"
    invokerPackage = "com.gymapi.auth.adapter.in.web.invoker.generated"
    
    configOptions = [
        interfaceOnly: "true",
        useOptional: "true",
        implicitHeaders: "true",
        swaggerAnnotations: "false",
        beanAnnotations: "false",
        useJakarta: "true",
        useLombokAnnotations: "true",
        disableValidationJsonAnnotations: "true"
    ]
    
    globalProperties = [
        modelTests: "false",
        apiTests: "false"
    ]
}

tasks.named('openApiGenerate') {
    description = "Generate DTOs from OpenAPI YAML spec"
    group = "openapi"
}
