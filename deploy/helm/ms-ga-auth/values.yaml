# Everything specific to ms-ga-auth lives here. templates/ mentions this service nowhere, so when
# a second service needs the same shape, templates/ moves to a platform chart and this file stays.
#
# Defaults target a production-shaped cluster. Override per environment with -f, e.g.
#   helm upgrade --install ms-ga-auth deploy/helm/ms-ga-auth -f values-staging.yaml

nameOverride: ""
fullnameOverride: ""

component: authorization
partOf: gymapi

# --- Workload ---------------------------------------------------------------

replicaCount: 2
revisionHistoryLimit: 5

image:
  repository: ghcr.io/gymapi/ms-ga-auth
  # Empty means fall back to Chart.appVersion. CI should set `digest` instead — a moving tag makes
  # a rollback ambiguous.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

rollingUpdate:
  # Never drop below the current replica count during an upgrade: this service is on the login
  # path for the entire platform.
  maxUnavailable: 0
  maxSurge: 1

# The chain that has to hold, longest outermost:
#   Kafka publish 25s  <  spring.lifecycle.timeout-per-shutdown-phase 30s  <  this 45s
# Break it and a rolling update SIGKILLs a pod mid-publish, leaving the caller unable to tell
# whether the change committed.
terminationGracePeriodSeconds: 45

# Endpoint removal and SIGTERM race: pause so the ingress stops routing here before the
# application starts refusing connections.
preStopSleepSeconds: 5

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    # No CPU limit on purpose: throttling a JVM through startup makes migration and class loading
    # much slower, and this pod is on the login path. The request guarantees the floor; the
    # namespace quota bounds the ceiling.
    memory: 768Mi

# Spread across nodes so losing one does not take the whole RBAC service with it.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
extraEnv: []
extraVolumes: []
extraVolumeMounts: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

# --- Probes -----------------------------------------------------------------
# Paths depend on management.endpoint.health.probes.enabled, already set in application.yml.

probes:
  # Flyway runs the migrations during startup, so first boot against a fresh database is slow.
  # 30 x 5s = 150s of headroom before liveness begins.
  startup:
    path: /actuator/health/readiness
    periodSeconds: 5
    failureThreshold: 30
    timeoutSeconds: 3
  liveness:
    path: /actuator/health/liveness
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 3
  readiness:
    path: /actuator/health/readiness
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 3

# --- Service ----------------------------------------------------------------

service:
  type: ClusterIP
  port: 8082
  targetPort: 8082
  annotations: {}

# --- Application configuration ----------------------------------------------
# Each key becomes an environment variable; they match the ${...} defaults in application.yml.

config:
  DB_HOST: postgres-auth.data.svc.cluster.local
  DB_PORT: "5432"
  DB_NAME: auth_db
  DB_USER: auth_service

  KAFKA_BROKERS: kafka-0.kafka.messaging.svc.cluster.local:9092,kafka-1.kafka.messaging.svc.cluster.local:9092,kafka-2.kafka.messaging.svc.cluster.local:9092
  AUTH_TOPIC: auth.events
  AUTH_TOPIC_PARTITIONS: "3"
  # The point of acks=all. Three replicas with two in sync survives losing a broker without losing
  # an acknowledged event; the local stack's 1/1 does not.
  AUTH_TOPIC_REPLICAS: "3"
  AUTH_TOPIC_MIN_ISR: "2"
  KAFKA_PUBLISH_TIMEOUT: 25s

  SCHEMA_REGISTRY_URL: http://schema-registry.messaging.svc.cluster.local:8081
  # False outside development: schemas are published by CI, so an incompatible change is caught in
  # review rather than registered by whichever pod deploys first.
  SCHEMA_AUTO_REGISTER: "false"

  # Where ms-ga-identifier publishes its public signing keys. The service verifies every bearer
  # token against these itself (ADR-0003) — no shared JWT secret exists anywhere in this chart.
  JWKS_URI: http://ms-ga-identifier:8081/identity/.well-known/jwks.json

  IDEMPOTENCY_RETENTION: 24h
  IDEMPOTENCY_IN_PROGRESS_TIMEOUT: 60s
  IDEMPOTENCY_PURGE_INTERVAL: 1h

  # No SPRING_PROFILES_ACTIVE on purpose. The default profile is the production one:
  # ddl-auto: validate with Flyway owning the schema. Never set `dev` here — that profile switches
  # Hibernate to ddl-auto: update, letting the application alter the schema behind the migrations.
  JAVA_TOOL_OPTIONS: "-XX:+ExitOnOutOfMemoryError"

# Secrets are never templated by this chart. Supply the named Secret from External Secrets, Sealed
# Secrets, or whatever the platform runs; deploy/secret.example.yaml documents the expected keys.
envFromSecrets:
  - ms-ga-auth-secrets

# --- Availability -----------------------------------------------------------

podDisruptionBudget:
  enabled: true
  minAvailable: 1

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
  scaleDownStabilizationSeconds: 300

# --- Network policy ---------------------------------------------------------
# Default-deny with an explicit allowlist. Load-bearing even though the service verifies JWTs
# itself (ADR-0003): the bootstrap route (/auth/users/{id}/roles/with-permissions) is authenticated
# by NetworkPolicy plus service credential, not by a token — so who can open a connection is still
# part of the security model.

networkPolicy:
  enabled: true
  ingress:
    # The gateway, for /auth administration.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gateway
      ports:
        - port: 8082
    # ms-ga-identifier, for login-path permission resolution. The only caller that reaches the
    # service directly, and the reason that endpoint needs no gateway route.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ms-ga-identifier
      ports:
        - port: 8082
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8082
  egress:
    # DNS. Omitting this is the classic mistake — everything else then resolves to nothing.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
      ports:
        - port: 5432
    # Kafka and the Schema Registry: publishing needs both, since a payload carries a schema id
    # the registry must have issued.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: messaging
      ports:
        - port: 9092
        - port: 8081
    # ms-ga-identifier's JWKS endpoint: RS256 verification needs the public keys (ADR-0003), and
    # under default-deny an unlisted egress means every token would be rejected as unverifiable.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ms-ga-identifier
      ports:
        - port: 8081

# --- Gateway ----------------------------------------------------------------
# Needs Gateway API and Kong Ingress Controller CRDs. Set enabled: false on a cluster without
# them; the service stays reachable in-cluster through its Service.

gateway:
  enabled: true
  parentRef:
    name: gymapi-gateway
    namespace: gateway
    sectionName: https
  hostnames:
    - api.gymapi.example
  paths:
    - type: PathPrefix
      value: /auth
  # Must exceed the 25s Kafka publish timeout.
  requestTimeout: 35s

  plugins:
    # Signature and expiry only. Kong resolves the token's `iss` claim to a consumer credential to
    # find the verification secret; that consumer is platform-owned, because every service behind
    # the gateway verifies the same tokens.
    - name: jwt
      plugin: jwt
      config:
        key_claim_name: iss
        claims_to_verify:
          - exp
        run_on_preflight: false

    - name: rate-limiting
      plugin: rate-limiting
      config:
        minute: 120
        hour: 2000
        # Cluster-wide counters: with several gateway replicas, per-node counters would multiply
        # the effective limit by the replica count.
        policy: redis
        redis_host: redis.messaging.svc.cluster.local
        redis_port: 6379
        fault_tolerant: true

    - name: cors
      plugin: cors
      config:
        # A named origin, not "*". The service's own WebConfig still allows any origin; that
        # should be narrowed or removed now the gateway owns CORS.
        origins:
          - https://admin.gymapi.example
        methods: [GET, POST, PUT, DELETE, OPTIONS]
        headers:
          - Accept
          - Content-Type
          - Authorization
          - Idempotency-Key
          - X-Correlation-Id
        exposed_headers:
          - X-Correlation-Id
          - Idempotency-Replayed
        credentials: true
        max_age: 3600

    # Claim extraction and the role:manage check.
    #
    # Kong OSS verifies a JWT's signature but does not surface its claims, and cannot assert that
    # one of them contains a value. Both happen here.
    #
    # post-function, not pre-function: pre-function has the highest priority in Kong and would run
    # before the jwt plugin, reading claims from a token whose signature had not been checked yet.
    # post-function runs last in the access phase, after jwt has accepted the token.
    - name: authz
      plugin: post-function
      config:
        access:
          - |
            local REQUIRED_PERMISSION = "role:manage"

            -- Never trust inbound X-User-* headers. The service treats them as verified identity,
            -- so without this anyone who can reach the gateway could assert their own permissions.
            for _, header in ipairs({ "X-User-Id", "X-User-Email", "X-User-Roles",
                                      "X-User-Permissions", "X-User-Jti" }) do
              kong.service.request.clear_header(header)
            end

            -- Mirrors the service's ErrorResponse envelope, so a client sees one error shape
            -- whether the gateway or the application refused the request.
            local function deny(status, code, message)
              return kong.response.exit(status, {
                timestamp = os.date("!%Y-%m-%dT%H:%M:%S.000Z"),
                status    = status,
                error     = status == 401 and "Unauthorized" or "Forbidden",
                code      = code,
                message   = message,
                path      = kong.request.get_path(),
                traceId   = kong.request.get_header("X-Correlation-Id"),
              }, { ["Content-Type"] = "application/json" })
            end

            local authorization = kong.request.get_header("authorization")
            local token = authorization and authorization:match("^[Bb]earer%s+(.+)$")
            if not token then
              return deny(401, "UNAUTHENTICATED",
                          "Authentication is required to access this resource")
            end

            local jwt_parser = require "kong.plugins.jwt.jwt_parser"
            local jwt, err = jwt_parser:new(token)
            if err or not jwt then
              return deny(401, "UNAUTHENTICATED", "Bearer token could not be read")
            end

            local claims = jwt.claims or {}
            local permissions = claims.permissions or {}

            local granted = false
            for _, permission in ipairs(permissions) do
              if permission == REQUIRED_PERMISSION then
                granted = true
                break
              end
            end
            if not granted then
              return deny(403, "ACCESS_DENIED",
                          "Managing roles and permissions requires " .. REQUIRED_PERMISSION)
            end

            kong.service.request.set_header("X-User-Id", claims.sub or "")
            kong.service.request.set_header("X-User-Email", claims.email or "")
            kong.service.request.set_header("X-User-Roles", table.concat(claims.roles or {}, ","))
            kong.service.request.set_header("X-User-Permissions", table.concat(permissions, ","))
            kong.service.request.set_header("X-User-Jti", claims.jti or "")
