apiVersion: v2
name: ms-ga-auth
description: Authorization management for the GymAPI platform — RBAC roles, permissions and user assignments.
type: application

# Chart version: bumped when the templates change.
version: 0.1.0
# Application version: the image tag deployed by default. Keep in step with the Gradle project
# version, and override per environment rather than editing this.
appVersion: "0.0.1-SNAPSHOT"

keywords:
  - rbac
  - authorization
  - gymapi

maintainers:
  - name: GymAPI Platform Team
    email: platform@gymapi.local

