{{- if .Values.networkPolicy.enabled }}
{{/*
Default-deny with an explicit allowlist.

This is load-bearing, not hygiene. The service leaves /auth/** permitAll and trusts whatever
reaches it, so "who can open a connection" is part of its security model. It is also what replaces
the service key and IP allowlist the docker-compose gateway needs for the login endpoint.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gymapi.fullname" . }}
  labels:
    {{- include "gymapi.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "gymapi.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress

  ingress:
    {{- range .Values.networkPolicy.ingress }}
    - from:
        {{- toYaml .from | nindent 8 }}
      ports:
        {{- range .ports }}
        - protocol: {{ .protocol | default "TCP" }}
          port: {{ .port }}
        {{- end }}
    {{- end }}

  egress:
    {{- range .Values.networkPolicy.egress }}
    - to:
        {{- toYaml .to | nindent 8 }}
      ports:
        {{- range .ports }}
        - protocol: {{ .protocol | default "TCP" }}
          port: {{ .port }}
        {{- end }}
    {{- end }}
{{- end }}
