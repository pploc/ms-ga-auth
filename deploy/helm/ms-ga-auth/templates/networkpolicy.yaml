{{- if .Values.networkPolicy.enabled }}
{{/*
Default-deny with an explicit allowlist.

This is load-bearing, not hygiene. The service verifies JWTs itself (ADR-0003), but the bootstrap
route (/auth/users/{id}/roles/with-permissions) is deliberately token-free — it is authenticated
by service credential and by *this policy* deciding who can open a connection at all. It is also
what replaces the service key and IP allowlist the docker-compose gateway needs for that endpoint.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gymapi.fullname" . }}
  labels:
    {{- include "gymapi.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "gymapi.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress

  ingress:
    {{- range .Values.networkPolicy.ingress }}
    - from:
        {{- toYaml .from | nindent 8 }}
      ports:
        {{- range .ports }}
        - protocol: {{ .protocol | default "TCP" }}
          port: {{ .port }}
        {{- end }}
    {{- end }}

  egress:
    {{- range .Values.networkPolicy.egress }}
    - to:
        {{- toYaml .to | nindent 8 }}
      ports:
        {{- range .ports }}
        - protocol: {{ .protocol | default "TCP" }}
          port: {{ .port }}
        {{- end }}
    {{- end }}
{{- end }}
