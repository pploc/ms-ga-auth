{{/*
ClusterIP. Two very different callers reach this service:

  * the gateway, for /auth administration — see gateway.yaml
  * ms-ga-identifier, calling /auth/users/{id}/roles/with-permissions while minting a token.
    That call goes straight here, never through the public gateway, and networkpolicy.yaml is
    what keeps it private.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gymapi.fullname" . }}
  labels:
    {{- include "gymapi.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "gymapi.selectorLabels" . | nindent 4 }}
---
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gymapi.serviceAccountName" . }}
  labels:
    {{- include "gymapi.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{/*
The service talks to Postgres, Kafka and the Schema Registry — never to the Kubernetes API.
Mounting a token would hand a compromised pod cluster credentials it has no use for.
*/}}
automountServiceAccountToken: false
{{- end }}
