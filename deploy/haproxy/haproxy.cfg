# HAProxy in front of Kong.
#
# Division of labour: HAProxy terminates TLS and spreads load across Kong nodes; Kong does
# authentication, authorisation, rate limiting and header injection. Keep it that way — routing
# policy split across two layers is how you end up with an endpoint nobody realises is public.

global
    log stdout format raw local0 info
    maxconn 4096
    # Modern defaults; drops everything below TLS 1.2.
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    # Adds the client address to X-Forwarded-For so Kong's ip-restriction and rate limiting see
    # the caller rather than this proxy.
    option  forwardfor

    timeout connect 5s
    timeout client  40s
    # Must exceed Kong's read_timeout (35s), which must in turn exceed the service's 25s Kafka
    # publish timeout. Cut this short and a mutating request is killed mid-decision: the caller
    # gets 504 and cannot tell whether the change committed.
    timeout server  40s
    timeout http-request 10s
    timeout http-keep-alive 10s

    # Connection-level retries only, which are safe because the request never reached a backend.
    # Layer-7 retries are off by default and must stay off: replaying a POST that Kong already
    # forwarded would duplicate a role assignment. Retrying is the client's call, made safe with
    # an Idempotency-Key.
    retries 2
    option redispatch

# ---------------------------------------------------------------------------
# Public entry point
#
# Plain HTTP, for the local stack. In any deployed environment use the TLS frontend below
# instead and make this one a permanent redirect.
# ---------------------------------------------------------------------------
frontend gateway_http
    bind *:8000

    # Basic hardening at the edge.
    http-request deny if { path_beg /kong-admin }
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header X-Frame-Options DENY
    http-response set-header Referrer-Policy no-referrer

    # Strip anything claiming to already be a verified identity. Kong clears these too — belt and
    # braces, because the cost of one of them being forgotten is impersonation.
    http-request del-header X-User-Id
    http-request del-header X-User-Email
    http-request del-header X-User-Roles
    http-request del-header X-User-Permissions
    http-request del-header X-User-Jti

    # Crude volumetric guard. Per-consumer limits are Kong's job; this is only here to stop one
    # source exhausting connections before Kong gets a say.
    stick-table type ip size 100k expire 60s store http_req_rate(10s)
    http-request track-sc0 src
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 400 }

    default_backend kong_nodes

# ---------------------------------------------------------------------------
# TLS entry point — enable in deployed environments.
#
# Needs a combined cert+key PEM at /usr/local/etc/haproxy/certs/. For a local self-signed one:
#
#   openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
#     -keyout key.pem -out cert.pem -subj "/CN=localhost"
#   cat cert.pem key.pem > deploy/haproxy/certs/gateway.pem
#
# Certificates are not committed — mount them from your secret store.
# ---------------------------------------------------------------------------
# frontend gateway_https
#     bind *:443 ssl crt /usr/local/etc/haproxy/certs/gateway.pem alpn h2,http/1.1
#     http-request set-header X-Forwarded-Proto https
#     http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"
#     http-request del-header X-User-Id
#     http-request del-header X-User-Email
#     http-request del-header X-User-Roles
#     http-request del-header X-User-Permissions
#     http-request del-header X-User-Jti
#     default_backend kong_nodes

# ---------------------------------------------------------------------------
# Kong
#
# Health-checked on Kong's own status endpoint, not on a proxied route: a failing upstream
# service should surface as that service's error, not as the gateway being pulled out of
# rotation for everyone.
# ---------------------------------------------------------------------------
backend kong_nodes
    balance roundrobin
    option httpchk
    http-check send meth GET uri /status ver HTTP/1.1 hdr Host kong
    http-check expect status 200

    # One node locally. Add the rest here — Kong is stateless in DB-less mode, so scaling it is
    # just more lines.
    server kong-1 kong:8000 check port 8100 inter 5s fall 3 rise 2 maxconn 512
    # server kong-2 kong-2:8000 check port 8100 inter 5s fall 3 rise 2 maxconn 512

# ---------------------------------------------------------------------------
# Operational endpoints, bound to localhost only.
# ---------------------------------------------------------------------------
frontend stats
    bind 127.0.0.1:8404
    bind *:8404
    stats enable
    stats uri /
    stats refresh 10s
    # No credentials here: the port is not published outside the compose network. Put this behind
    # authentication before exposing it anywhere.
