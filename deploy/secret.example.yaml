# TEMPLATE ONLY — do not apply, and do not fill this in and commit it.
#
# Kept outside the Helm chart so it can never be rendered or applied by accident. It exists
# to document which keys the Deployment's secretRef expects.
#
# Use whatever the platform already runs:
#
#   External Secrets Operator
#     kind: ExternalSecret, pulling from Vault/AWS Secrets Manager into ms-ga-auth-secrets
#
#   Sealed Secrets
#     kubeseal < secret.yaml > sealed-secret.yaml   # the sealed output is safe to commit
#
# No JWT key material lives here. Tokens are RS256-signed by ms-ga-identifier alone (ADR-0003);
# this service verifies them against identifier's public JWKS (the JWKS_URI config value) and
# holds nothing that could mint one.
apiVersion: v1
kind: Secret
metadata:
  name: ms-ga-auth-secrets
  labels:
    app.kubernetes.io/name: ms-ga-auth
    app.kubernetes.io/part-of: gymapi
type: Opaque
stringData:
  DB_PASS: "REPLACE_ME"
