apiVersion: v1
kind: ServiceAccount
metadata:
  name: ms-ga-auth
  labels:
    app.kubernetes.io/name: ms-ga-auth
    app.kubernetes.io/component: authorization
    app.kubernetes.io/part-of: gymapi
# The service talks to Postgres, Kafka and the Schema Registry — never to the Kubernetes API.
# Mounting a token would hand a compromised pod cluster credentials it has no use for.
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-ga-auth
  labels:
    app.kubernetes.io/name: ms-ga-auth
    app.kubernetes.io/component: authorization
    app.kubernetes.io/part-of: gymapi
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ms-ga-auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ms-ga-auth
        app.kubernetes.io/component: authorization
        app.kubernetes.io/part-of: gymapi
      annotations:
        # Roll the pods when configuration changes; without this a ConfigMap edit is invisible
        # until something else triggers a restart.
        checksum/config: "replace-with-configmap-hash-in-ci"
    spec:
      serviceAccountName: ms-ga-auth
      automountServiceAccountToken: false

      # Must exceed spring.lifecycle.timeout-per-shutdown-phase (30s), which must in turn exceed
      # the 25s Kafka publish timeout. Too short and the kubelet SIGKILLs a pod that is still
      # waiting for a broker ack, leaving the caller unable to tell whether the change committed.
      terminationGracePeriodSeconds: 45

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      # Spread across nodes so losing one does not take the whole RBAC service with it. Every
      # login depends on this service, so it is on the critical path for the entire platform.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ms-ga-auth

      containers:
        - name: ms-ga-auth
          # Overridden per environment by the `images:` block in kustomization.yaml. Pin a digest
          # in production — a moving tag makes a rollback ambiguous.
          image: ghcr.io/gymapi/ms-ga-auth:0.0.1-SNAPSHOT
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8082
              protocol: TCP

          envFrom:
            - configMapRef:
                name: ms-ga-auth-config
            - secretRef:
                name: ms-ga-auth-secrets

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          # readOnlyRootFilesystem means the JVM needs somewhere to write; it uses /tmp for
          # perf data and any temp files.
          volumeMounts:
            - name: tmp
              mountPath: /tmp

          # Flyway runs the migrations during startup, so first boot on a fresh database is slow.
          # The startup probe absorbs that: liveness does not begin until this succeeds, so a slow
          # migration cannot be mistaken for a hung process and killed halfway through.
          # 30 x 5s = 150s of headroom.
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 3

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3

          # Readiness includes the database. A pod that has lost Postgres stops taking traffic
          # but is not restarted — restarting would not bring the database back.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3

          lifecycle:
            preStop:
              exec:
                # Endpoint removal and SIGTERM race. This pause lets the ingress stop routing here
                # before the application starts refusing connections, so a rolling update does not
                # drop requests.
                command: ["sh", "-c", "sleep 5"]

          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              # No CPU limit on purpose: throttling a JVM during startup makes the migration and
              # class-loading phase much slower, and this pod is on the login path. The request
              # guarantees the floor; the namespace quota bounds the ceiling.
              memory: 768Mi

      volumes:
        - name: tmp
          emptyDir: {}
