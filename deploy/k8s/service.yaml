# ClusterIP only. Two very different callers reach this service, and they arrive differently:
#
#   * The gateway, for /auth administration — see gateway.yaml.
#   * ms-ga-identifier, calling /auth/users/{id}/roles/with-permissions while minting a token.
#     That call goes straight to this Service, never through the public gateway. In the
#     docker-compose setup it needed a service key and an IP allowlist to stay private; in the
#     cluster the NetworkPolicy in resilience.yaml does that job properly.
apiVersion: v1
kind: Service
metadata:
  name: ms-ga-auth
  labels:
    app.kubernetes.io/name: ms-ga-auth
    app.kubernetes.io/component: authorization
    app.kubernetes.io/part-of: gymapi
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8082
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: ms-ga-auth
