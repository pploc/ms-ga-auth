# Availability and blast-radius controls.
#
# Every login on the platform resolves permissions through this service, so it being unavailable
# is a total outage, not a degraded feature. These three resources exist for that reason.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ms-ga-auth
  labels:
    app.kubernetes.io/name: ms-ga-auth
    app.kubernetes.io/part-of: gymapi
spec:
  # minAvailable, not maxUnavailable: with an HPA changing the replica count, a percentage would
  # silently permit a full drain at the low end.
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ms-ga-auth
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ms-ga-auth
  labels:
    app.kubernetes.io/name: ms-ga-auth
    app.kubernetes.io/part-of: gymapi
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ms-ga-auth
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # Login traffic is spiky. Scaling down eagerly means paying the JVM warm-up cost again on
      # the next spike, on the platform's most latency-sensitive path.
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 30
---
# Default-deny with an explicit allowlist.
#
# This is the control that replaces the docker-compose service key and IP allowlist. The service
# leaves /auth/** permitAll and trusts whatever reaches it, so "who can open a connection" is a
# real part of its security model, not a nicety.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ms-ga-auth
  labels:
    app.kubernetes.io/name: ms-ga-auth
    app.kubernetes.io/part-of: gymapi
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ms-ga-auth
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # The gateway, for /auth administration.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gateway
      ports:
        - protocol: TCP
          port: 8082

    # ms-ga-identifier, for the login-path permission resolution. This is the only caller that
    # reaches the service directly rather than through the gateway, and it is why that endpoint
    # needs no route of its own.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ms-ga-identifier
      ports:
        - protocol: TCP
          port: 8082

    # Prometheus scraping /actuator, if the platform runs it.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8082

  egress:
    # DNS. Omitting this is the classic mistake — everything else resolves to nothing.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
      ports:
        - protocol: TCP
          port: 5432

    # Kafka brokers and the Schema Registry: publishing needs both, since a payload carries a
    # schema id the registry has to have issued.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: messaging
      ports:
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 8081
