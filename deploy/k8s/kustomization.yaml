# Deploy with:
#   kubectl apply -k deploy/k8s
#
# secret.example.yaml is intentionally not listed — it is a template with placeholder values.
# Supply ms-ga-auth-secrets from External Secrets, Sealed Secrets, or whatever the platform runs.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Set by the platform, not hard-coded into the manifests, so the same base deploys to any of them.
namespace: gymapi

commonLabels:
  app.kubernetes.io/name: ms-ga-auth
  app.kubernetes.io/part-of: gymapi
  app.kubernetes.io/managed-by: kustomize

resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - resilience.yaml
  # Needs Gateway API and the Kong Ingress Controller CRDs installed. Comment out when deploying
  # to a cluster without them — the service is still reachable in-cluster via the Service.
  - gateway.yaml

images:
  - name: ghcr.io/gymapi/ms-ga-auth
    newTag: 0.0.1-SNAPSHOT
    # CI should set a digest instead, so a rollback is unambiguous:
    #   kustomize edit set image ghcr.io/gymapi/ms-ga-auth@sha256:...

# Rolls the pods whenever the ConfigMap changes: kustomize appends a content hash to the name and
# rewrites the reference, which the checksum annotation in deployment.yaml only approximates.
configMapGenerator: []
generatorOptions:
  disableNameSuffixHash: false
