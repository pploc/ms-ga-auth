# TEMPLATE ONLY — do not apply, and do not fill this in and commit it.
#
# Excluded from kustomization.yaml so `kubectl apply -k` cannot pick it up by accident. It exists
# to document which keys the Deployment's secretRef expects.
#
# Use whatever the platform already runs:
#
#   External Secrets Operator
#     kind: ExternalSecret, pulling from Vault/AWS Secrets Manager into ms-ga-auth-secrets
#
#   Sealed Secrets
#     kubeseal < secret.yaml > sealed-secret.yaml   # the sealed output is safe to commit
#
# JWT_SECRET in particular is the HMAC key every service in the platform verifies tokens with.
# Leaking it means anyone can mint a SUPER_ADMIN token. It is shared with ms-ga-identifier, which
# signs with it, and with Kong, which verifies with it — rotate all three together.
#
# Note that application.yml carries a working default for JWT_SECRET, so a deployment missing this
# Secret starts successfully with a publicly known signing key rather than failing. Until that
# default is removed, treat a missing Secret as a live incident, not a misconfiguration.
apiVersion: v1
kind: Secret
metadata:
  name: ms-ga-auth-secrets
  labels:
    app.kubernetes.io/name: ms-ga-auth
    app.kubernetes.io/part-of: gymapi
type: Opaque
stringData:
  DB_PASS: "REPLACE_ME"
  JWT_SECRET: "REPLACE_ME_AT_LEAST_32_BYTES_FOR_HS256"
