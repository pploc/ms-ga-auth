server:
  port: 8082
  # In-flight requests finish before the container exits. Without this, a rolling update kills a
  # mutating request mid-publish and the caller cannot tell whether the change committed.
  shutdown: graceful
  error:
    # Unmatched paths are rendered by GlobalExceptionHandler as the standard ErrorResponse
    # envelope, so the whitelabel page and the servlet /error forward are not wanted.
    whitelabel:
      enabled: false

spring:
  application:
    name: ms-ga-auth
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:auth_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    # At-least-once delivery. The publisher blocks on the ack and rolls its transaction back when
    # it does not arrive, so nothing here may quietly give up early.
    producer:
      acks: all
      retries: 2147483647
      properties:
        # De-duplicates the retries above at the broker, so a redelivered batch is not written
        # twice. Requires acks=all, retries > 0 and max.in.flight <= 5, all set here.
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        # The real retry budget: the client keeps retrying until this elapses, then fails.
        delivery.timeout.ms: 20000
        request.timeout.ms: 10000
        retry.backoff.ms: 200
        # Bounds how long a send can block on metadata when the broker is unreachable.
        max.block.ms: 5000
        linger.ms: 5
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    # Keeps optional members such as `fieldErrors` and `traceId` out of the payload when they
    # carry nothing, instead of emitting explicit nulls.
    default-property-inclusion: non_null
  mvc:
    throw-exception-if-no-handler-found: true
  lifecycle:
    # Must exceed gymapi.events.publish-timeout (25s), or graceful shutdown gives up while a
    # request is still waiting for its Kafka ack. The pod's terminationGracePeriodSeconds must in
    # turn exceed this — see deploy/k8s/deployment.yaml.
    timeout-per-shutdown-phase: 30s
  threads:
    # Request handling now blocks on the Kafka ack before responding. On virtual threads that wait
    # parks a continuation instead of holding a platform thread, so a slow broker cannot exhaust
    # the request pool.
    virtual:
      enabled: true

gymapi:
  events:
    topic: ${AUTH_TOPIC:auth.events}
    partitions: ${AUTH_TOPIC_PARTITIONS:3}
    # acks=all only means "durable" if at least two replicas must be in sync. Raise both of these
    # to 3/2 anywhere that is not a single-broker dev stack.
    replicas: ${AUTH_TOPIC_REPLICAS:1}
    min-insync-replicas: ${AUTH_TOPIC_MIN_ISR:1}
    # Must exceed the producer's delivery.timeout.ms so its retries run out before we stop waiting.
    publish-timeout: ${KAFKA_PUBLISH_TIMEOUT:25s}
    # Events are Avro; payloads carry a schema id, so this has to be reachable to publish.
    # 8181 is the host port docker-compose publishes the registry on — 8081 belongs to
    # ms-ga-identifier. Inside the compose network the app is given http://schema-registry:8081.
    schema-registry-url: ${SCHEMA_REGISTRY_URL:http://localhost:8181}
    # Convenient locally. Set false in production and publish the schema from CI, so an
    # incompatible change is caught in review rather than by whichever pod deploys first.
    auto-register-schemas: ${SCHEMA_AUTO_REGISTER:true}
  idempotency:
    retention: ${IDEMPOTENCY_RETENTION:24h}
    in-progress-timeout: ${IDEMPOTENCY_IN_PROGRESS_TIMEOUT:60s}
    purge-interval: ${IDEMPOTENCY_PURGE_INTERVAL:1h}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true

jwt:
  secret: ${JWT_SECRET:supersecretkeythatisverylongandsecureenoughforHS256}

logging:
  level:
    com.gymapi.auth: INFO
  pattern:
    # `%ex` is appended after the JSON object: without it Logback drops stack traces entirely,
    # which would make the deliberately generic 500 message impossible to diagnose.
    console: '{"timestamp":"%d{ISO8601}","level":"%p","service":"ms-ga-auth","logger":"%logger{40}","correlation_id":"%X{correlationId}","message":"%m"}%n%ex'
