server:
  port: 8082

spring:
  application:
    name: ms-ga-auth
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auth_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

kafka:
  bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
  topic:
    auth: auth.events

jwt:
  secret: ${JWT_SECRET:supersecretkeythatisverylongandsecureenoughforHS256}

logging:
  level:
    com.gymapi.auth: INFO
  pattern:
    console: '{"timestamp":"%d","level":"%p","service":"ms-ga-auth","correlation_id":"%X{correlationId}","message":"%m"}%n'
