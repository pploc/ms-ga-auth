openapi: 3.0.3
info:
  title: ms-ga-auth API
  description: Authorization Management Service API
  version: 1.0.0
servers:
  - url: http://localhost:8082
    description: Local server

paths:
  /auth/roles:
    get:
      tags:
        - Role Management
      summary: Get all roles
      operationId: getAllRoles
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleResponse'
    post:
      tags:
        - Role Management
      summary: Create a new role
      operationId: createRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
      responses:
        201:
          description: Role created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'

  /auth/roles/{id}:
    get:
      tags:
        - Role Management
      summary: Get role by ID
      operationId: getRoleById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
    put:
      tags:
        - Role Management
      summary: Update a role
      operationId: updateRole
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
      responses:
        200:
          description: Role updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
    delete:
      tags:
        - Role Management
      summary: Delete a role
      operationId: deleteRole
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        204:
          description: Role deleted

  /auth/roles/{id}/permissions:
    get:
      tags:
        - Role Management
      summary: Get permissions for a role
      operationId: getRolePermissions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PermissionResponse'
    put:
      tags:
        - Role Management
      summary: Set permissions for a role
      operationId: setRolePermissions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRolePermissionsRequest'
      responses:
        200:
          description: Permissions updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetPermissionsResponse'

  /auth/permissions:
    get:
      tags:
        - Permission Management
      summary: Get all permissions
      operationId: getAllPermissions
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PermissionResponse'
    post:
      tags:
        - Permission Management
      summary: Create a new permission
      operationId: createPermission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePermissionRequest'
      responses:
        201:
          description: Permission created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionResponse'

  /auth/permissions/{id}:
    get:
      tags:
        - Permission Management
      summary: Get permission by ID
      operationId: getPermissionById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionResponse'
    put:
      tags:
        - Permission Management
      summary: Update a permission
      operationId: updatePermission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePermissionRequest'
      responses:
        200:
          description: Permission updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionResponse'
    delete:
      tags:
        - Permission Management
      summary: Delete a permission
      operationId: deletePermission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        204:
          description: Permission deleted

  /auth/users/{userId}/roles:
    get:
      tags:
        - User Role Management
      summary: Get all roles for a user
      operationId: getUserRoles
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserRoleResponse'
    post:
      tags:
        - User Role Management
      summary: Assign a role to a user
      operationId: assignRole
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRoleRequest'
      responses:
        201:
          description: Role assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignRoleResponse'

  /auth/users/{userId}/roles/{roleId}:
    delete:
      tags:
        - User Role Management
      summary: Revoke a role from a user
      operationId: revokeRole
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: roleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Role removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /auth/users/{userId}/roles/with-permissions:
    get:
      tags:
        - User Role Management
      summary: Get user's roles with permissions (internal use)
      operationId: getUserRolesWithPermissions
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolesWithPermissionsResponse'

components:
  schemas:
    RoleResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        isSystem:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateRoleRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 50
        description:
          type: string
        system:
          type: boolean

    UpdateRoleRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 50
        description:
          type: string

    PermissionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        resource:
          type: string
        action:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time

    CreatePermissionRequest:
      type: object
      required:
        - resource
        - action
      properties:
        resource:
          type: string
          maxLength: 50
        action:
          type: string
          maxLength: 50
        description:
          type: string

    UpdatePermissionRequest:
      type: object
      properties:
        resource:
          type: string
          maxLength: 50
        action:
          type: string
          maxLength: 50
        description:
          type: string

    SetRolePermissionsRequest:
      type: object
      required:
        - permissionIds
      properties:
        permissionIds:
          type: array
          items:
            type: string
            format: uuid

    SetPermissionsResponse:
      type: object
      properties:
        message:
          type: string
        permissionCount:
          type: integer

    UserRoleResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        roleId:
          type: string
          format: uuid
        roleName:
          type: string
        assignedBy:
          type: string
          format: uuid
        assignedAt:
          type: string
          format: date-time

    AssignRoleRequest:
      type: object
      required:
        - roleId
      properties:
        roleId:
          type: string
          format: uuid
        assignedBy:
          type: string
          format: uuid

    AssignRoleResponse:
      type: object
      properties:
        message:
          type: string
        userId:
          type: string
          format: uuid
        roleId:
          type: string
          format: uuid

    MessageResponse:
      type: object
      properties:
        message:
          type: string

    RolesWithPermissionsResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
