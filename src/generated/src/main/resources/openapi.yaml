openapi: 3.0.3
info:
  description: Authorization Management Service API
  title: ms-ga-auth API
  version: 1.0.0
servers:
- description: Local server
  url: http://localhost:8082
paths:
  /auth/roles:
    get:
      operationId: getAllRoles
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/RoleResponse"
                type: array
          description: Successful response
      summary: Get all roles
      tags:
      - Role Management
      x-accepts:
      - application/json
      x-tags:
      - tag: Role Management
    post:
      operationId: createRole
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleResponse"
          description: Role created
      summary: Create a new role
      tags:
      - Role Management
      x-content-type: application/json
      x-accepts:
      - application/json
      x-tags:
      - tag: Role Management
  /auth/roles/{id}:
    delete:
      operationId: deleteRole
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "204":
          description: Role deleted
      summary: Delete a role
      tags:
      - Role Management
      x-accepts:
      - application/json
      x-tags:
      - tag: Role Management
    get:
      operationId: getRoleById
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleResponse"
          description: Successful response
      summary: Get role by ID
      tags:
      - Role Management
      x-accepts:
      - application/json
      x-tags:
      - tag: Role Management
    put:
      operationId: updateRole
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleResponse"
          description: Role updated
      summary: Update a role
      tags:
      - Role Management
      x-content-type: application/json
      x-accepts:
      - application/json
      x-tags:
      - tag: Role Management
  /auth/roles/{id}/permissions:
    get:
      operationId: getRolePermissions
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/PermissionResponse"
                type: array
          description: Successful response
      summary: Get permissions for a role
      tags:
      - Role Management
      x-accepts:
      - application/json
      x-tags:
      - tag: Role Management
    put:
      operationId: setRolePermissions
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetRolePermissionsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetPermissionsResponse"
          description: Permissions updated
      summary: Set permissions for a role
      tags:
      - Role Management
      x-content-type: application/json
      x-accepts:
      - application/json
      x-tags:
      - tag: Role Management
  /auth/permissions:
    get:
      operationId: getAllPermissions
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/PermissionResponse"
                type: array
          description: Successful response
      summary: Get all permissions
      tags:
      - Permission Management
      x-accepts:
      - application/json
      x-tags:
      - tag: Permission Management
    post:
      operationId: createPermission
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePermissionRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionResponse"
          description: Permission created
      summary: Create a new permission
      tags:
      - Permission Management
      x-content-type: application/json
      x-accepts:
      - application/json
      x-tags:
      - tag: Permission Management
  /auth/permissions/{id}:
    delete:
      operationId: deletePermission
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "204":
          description: Permission deleted
      summary: Delete a permission
      tags:
      - Permission Management
      x-accepts:
      - application/json
      x-tags:
      - tag: Permission Management
    get:
      operationId: getPermissionById
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionResponse"
          description: Successful response
      summary: Get permission by ID
      tags:
      - Permission Management
      x-accepts:
      - application/json
      x-tags:
      - tag: Permission Management
    put:
      operationId: updatePermission
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePermissionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionResponse"
          description: Permission updated
      summary: Update a permission
      tags:
      - Permission Management
      x-content-type: application/json
      x-accepts:
      - application/json
      x-tags:
      - tag: Permission Management
  /auth/users/{userId}/roles:
    get:
      operationId: getUserRoles
      parameters:
      - explode: false
        in: path
        name: userId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/UserRoleResponse"
                type: array
          description: Successful response
      summary: Get all roles for a user
      tags:
      - User Role Management
      x-accepts:
      - application/json
      x-tags:
      - tag: User Role Management
    post:
      operationId: assignRole
      parameters:
      - explode: false
        in: path
        name: userId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignRoleRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignRoleResponse"
          description: Role assigned
      summary: Assign a role to a user
      tags:
      - User Role Management
      x-content-type: application/json
      x-accepts:
      - application/json
      x-tags:
      - tag: User Role Management
  /auth/users/{userId}/roles/{roleId}:
    delete:
      operationId: revokeRole
      parameters:
      - explode: false
        in: path
        name: userId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - explode: false
        in: path
        name: roleId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: Role removed
      summary: Revoke a role from a user
      tags:
      - User Role Management
      x-accepts:
      - application/json
      x-tags:
      - tag: User Role Management
  /auth/users/{userId}/roles/with-permissions:
    get:
      operationId: getUserRolesWithPermissions
      parameters:
      - explode: false
        in: path
        name: userId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolesWithPermissionsResponse"
          description: Successful response
      summary: Get user's roles with permissions (internal use)
      tags:
      - User Role Management
      x-accepts:
      - application/json
      x-tags:
      - tag: User Role Management
components:
  schemas:
    RoleResponse:
      example:
        isSystem: true
        createdAt: 2000-01-23T04:56:07.000+00:00
        name: name
        description: description
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        updatedAt: 2000-01-23T04:56:07.000+00:00
      properties:
        id:
          format: uuid
          type: string
        name:
          type: string
        description:
          type: string
        isSystem:
          type: boolean
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      type: object
    CreateRoleRequest:
      example:
        system: true
        name: name
        description: description
      properties:
        name:
          maxLength: 50
          type: string
        description:
          type: string
        system:
          type: boolean
      required:
      - name
      type: object
    UpdateRoleRequest:
      example:
        name: name
        description: description
      properties:
        name:
          maxLength: 50
          type: string
        description:
          type: string
      type: object
    PermissionResponse:
      example:
        createdAt: 2000-01-23T04:56:07.000+00:00
        resource: resource
        action: action
        description: description
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      properties:
        id:
          format: uuid
          type: string
        resource:
          type: string
        action:
          type: string
        description:
          type: string
        createdAt:
          format: date-time
          type: string
      type: object
    CreatePermissionRequest:
      example:
        resource: resource
        action: action
        description: description
      properties:
        resource:
          maxLength: 50
          type: string
        action:
          maxLength: 50
          type: string
        description:
          type: string
      required:
      - action
      - resource
      type: object
    UpdatePermissionRequest:
      example:
        resource: resource
        action: action
        description: description
      properties:
        resource:
          maxLength: 50
          type: string
        action:
          maxLength: 50
          type: string
        description:
          type: string
      type: object
    SetRolePermissionsRequest:
      example:
        permissionIds:
        - 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        - 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      properties:
        permissionIds:
          items:
            format: uuid
            type: string
          type: array
      required:
      - permissionIds
      type: object
    SetPermissionsResponse:
      example:
        message: message
        permissionCount: 0
      properties:
        message:
          type: string
        permissionCount:
          type: integer
      type: object
    UserRoleResponse:
      example:
        assignedBy: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        roleId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        assignedAt: 2000-01-23T04:56:07.000+00:00
        roleName: roleName
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        userId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      properties:
        id:
          format: uuid
          type: string
        userId:
          format: uuid
          type: string
        roleId:
          format: uuid
          type: string
        roleName:
          type: string
        assignedBy:
          format: uuid
          type: string
        assignedAt:
          format: date-time
          type: string
      type: object
    AssignRoleRequest:
      example:
        assignedBy: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        roleId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      properties:
        roleId:
          format: uuid
          type: string
        assignedBy:
          format: uuid
          type: string
      required:
      - roleId
      type: object
    AssignRoleResponse:
      example:
        roleId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        message: message
        userId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      properties:
        message:
          type: string
        userId:
          format: uuid
          type: string
        roleId:
          format: uuid
          type: string
      type: object
    MessageResponse:
      example:
        message: message
      properties:
        message:
          type: string
      type: object
    RolesWithPermissionsResponse:
      example:
        permissions:
        - permissions
        - permissions
        roles:
        - roles
        - roles
        userId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      properties:
        userId:
          format: uuid
          type: string
        roles:
          items:
            type: string
          type: array
        permissions:
          items:
            type: string
          type: array
      type: object
