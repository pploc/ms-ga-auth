spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

server:
  port: 8082

# Never fetched in the unit suites (no test presents a bearer token there), but JwtProperties
# requires a value to bind.
gymapi:
  security:
    jwt:
      jwks-uri: http://localhost:65535/identity/.well-known/jwks.json

kafka:
  bootstrap-servers: localhost:9092
  topic:
    auth: auth.events
