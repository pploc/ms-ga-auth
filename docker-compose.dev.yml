# Local test environment: the service's dependencies only, no app container.
#
# Run it with `./gradlew startTestEnvironment`, then start the service from your IDE or
# `./gradlew bootRun` and drive it with curl or Postman. Keeping the app out of the stack is the
# point — you want to restart and debug it without rebuilding an image.
#
# Its own project name, so this stack never collides with `docker compose up` on the production
# compose file.
name: ms-ga-auth-dev

services:
  db:
    image: postgres:15-alpine
    container_name: ms-ga-auth-dev-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db
    # 5434 matches the application.yml default, so bootRun needs no extra configuration.
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - authdb_dev_data:/var/lib/postgresql/data

  # Single broker in KRaft mode — no ZooKeeper, one container, fast start.
  #
  # Everything is replication factor 1 as a result, so acks=all here means "the one broker wrote
  # it". That is fine for driving the API; it just is not a test of durability. Production should
  # run 3 replicas with min.insync.replicas 2 (gymapi.events.replicas / min-insync-replicas).
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: ms-ga-auth-dev-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      # INTERNAL for containers on this network, HOST for the app running on your machine.
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:9092
      # Fixed, so the broker keeps its identity across restarts.
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      # All 1: with a single broker, anything higher leaves internal topics under-replicated and
      # the Schema Registry never finishes starting.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    volumes:
      - kafka_dev_data:/var/lib/kafka/data

  # Holds the AuthEvent schema. Events are Avro, so publishing fails without it.
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: ms-ga-auth-dev-schema-registry
    # 8181 on the host: 8081 belongs to ms-ga-identifier. Matches the application.yml default.
    ports:
      - "8181:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      # Same rule as production: refuse a schema existing consumers could not read.
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: BACKWARD
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/subjects > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      kafka:
        condition: service_healthy

  # Browse the events your curl calls produce. Avro payloads are decoded through the registry,
  # which is otherwise painful to verify by hand.
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: ms-ga-auth-dev-kafka-ui
    ports:
      - "8100:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ms-ga-auth-dev
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      schema-registry:
        condition: service_healthy

  # --- Gateway, opt-in -----------------------------------------------------
  # Not started by `startTestEnvironment`; use `./gradlew startGateway`. Most of the time you
  # want to hit the service directly on :8082. Bring these up to test what callers actually
  # traverse: JWT validation, the role:manage check, rate limits, X-User-* injection.

  kong:
    image: kong:3.6
    container_name: ms-ga-auth-dev-kong
    profiles: ["gateway"]
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      # Substitutes ${JWT_SECRET} and ${IDENTIFIER_SERVICE_KEY} in kong.yml at load time.
      KONG_VAULTS: env
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      # Read-only in DB-less mode, and never published past HAProxy.
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_STATUS_LISTEN: 0.0.0.0:8100
      KONG_PLUGINS: bundled
      KONG_LOG_LEVEL: info
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      # Dev defaults, matching application.yml. Real deployments inject these from a secret store.
      JWT_SECRET: ${JWT_SECRET:-supersecretkeythatisverylongandsecureenoughforHS256}
      IDENTIFIER_SERVICE_KEY: ${IDENTIFIER_SERVICE_KEY:-dev-identifier-service-key}
    ports:
      # Kong's own proxy port, for comparing against the HAProxy path.
      - "8010:8000"
      - "127.0.0.1:8011:8001"
    volumes:
      - ./deploy/kong:/kong:ro
    # Lets Kong reach the app running on your machine via ./gradlew bootRun. Docker Desktop
    # provides this name already; the mapping is what makes it work on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "kong health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  haproxy:
    image: haproxy:2.9-alpine
    container_name: ms-ga-auth-dev-haproxy
    profiles: ["gateway"]
    # 8000 is what the OpenAPI spec lists as the gateway server URL.
    ports:
      - "8000:8000"
      - "127.0.0.1:8404:8404"
    volumes:
      - ./deploy/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      kong:
        condition: service_healthy

volumes:
  authdb_dev_data:
  kafka_dev_data:
